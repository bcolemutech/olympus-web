name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  checks: write
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: w9jds/setup-firebase@v1.0.0
        with:
          gcp_sa_key: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OLYMPUS_DFA00 }}
      - name: Deploy to Firebase Hosting
        id: deploy
        continue-on-error: true
        run: |
          set -o pipefail
          firebase deploy --only hosting --project olympus-dfa00 2>&1 | tee deploy.log
      # A network-level "premature close" can cause the Firebase CLI to
      # retry a release request whose first attempt already succeeded;
      # the retry then reports the version as already active even though
      # the deploy did go live. Treat that specific message as success
      # instead of failing the job — retrying the deploy hits the same
      # race and does not help.
      - name: Check for transient release race
        if: steps.deploy.outcome == 'failure'
        run: |
          if grep -q "is the current active version" deploy.log; then
            echo "Hosting content is already live (transient client-retry race) — treating as success."
          else
            echo "Hosting deploy failed:"
            cat deploy.log
            exit 1
          fi
  deploy_firestore:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: w9jds/setup-firebase@v1.0.0
        with:
          gcp_sa_key: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OLYMPUS_DFA00 }}
      - name: Deploy Firestore rules and indexes, and Storage rules
        run: firebase deploy --only firestore:rules,firestore:indexes,storage --project olympus-dfa00
  deploy_functions:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: w9jds/setup-firebase@v1.0.0
        with:
          gcp_sa_key: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OLYMPUS_DFA00 }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OLYMPUS_DFA00 }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: olympus-dfa00
      - name: Enable required GCP APIs
        run: |
          gcloud services enable \
            cloudfunctions.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            --project olympus-dfa00
      - name: Install functions dependencies
        run: npm ci --prefix functions
      # TEMPORARY (L-707): why can't the deploy read the studioRunJob Cloud
      # Tasks queue? Prints the account the deploy runs as, its roles, what
      # Cloud Tasks lets it do, and the queue. No keys or tokens are printed.
      # Remove once the queue deploys.
      - name: Diagnose Cloud Tasks access (temporary)
        continue-on-error: true
        run: |
          set +e
          ACCOUNT="$(gcloud config get-value account 2>/dev/null)"
          echo "== Deploying as: $ACCOUNT"
          echo "== Project: $(gcloud projects describe olympus-dfa00 --format='value(projectId,projectNumber)')"
          echo "== Cloud Tasks API enabled:"
          gcloud services list --enabled --project olympus-dfa00 \
            --filter="config.name=cloudtasks.googleapis.com" --format="value(config.name)"
          echo "== Project roles held by $ACCOUNT (needs getIamPolicy; may be refused):"
          gcloud projects get-iam-policy olympus-dfa00 --flatten="bindings[].members" \
            --filter="bindings.members:$ACCOUNT" --format="table(bindings.role,bindings.condition.title)"
          echo "== Who holds Cloud Tasks Admin:"
          gcloud projects get-iam-policy olympus-dfa00 --flatten="bindings[].members" \
            --filter="bindings.role=roles/cloudtasks.admin" --format="value(bindings.members)"
          echo "== Permissions $ACCOUNT has on the project (testIamPermissions):"
          curl -s -X POST \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/json" \
            "https://cloudresourcemanager.googleapis.com/v1/projects/olympus-dfa00:testIamPermissions" \
            -d '{"permissions":["cloudtasks.queues.get","cloudtasks.queues.list","cloudtasks.queues.create","cloudtasks.queues.update","cloudtasks.queues.getIamPolicy","cloudtasks.queues.setIamPolicy","cloudtasks.tasks.create","iam.serviceAccounts.actAs","run.services.get"]}'
          echo
          echo "== Queues in us-central1:"
          gcloud tasks queues list --location=us-central1 --project=olympus-dfa00
          echo "== The studioRunJob queue:"
          gcloud tasks queues describe studioRunJob --location=us-central1 --project=olympus-dfa00
          exit 0
      - name: Deploy Cloud Functions
        id: deploy_functions
        continue-on-error: true
        run: firebase deploy --only functions --force --project olympus-dfa00
      # TEMPORARY (L-707): deploys studioRunJob on its own, even when its code
      # is unchanged (an unchanged function is otherwise skipped, and its queue
      # never retried), and shows the CLI's Cloud Tasks requests and errors.
      - name: Deploy the studio's task queue (temporary)
        continue-on-error: true
        run: |
          set -o pipefail
          firebase deploy --only functions:studioRunJob --force --project olympus-dfa00 --debug 2>&1 \
            | grep -iE "cloudtasks|queue|studioRunJob|HTTP Error|permission|denied|error" \
            | grep -viE "authorization|bearer|token" || true
      - name: Grant Cloud Run invoker to allUsers for new callable functions
        run: |
          for svc in listusers; do
            gcloud run services add-iam-policy-binding "$svc" \
              --member="allUsers" \
              --role="roles/run.invoker" \
              --region=us-central1 \
              --project=olympus-dfa00
          done
      - name: Fail if function deploy failed
        if: steps.deploy_functions.outcome == 'failure'
        run: exit 1
