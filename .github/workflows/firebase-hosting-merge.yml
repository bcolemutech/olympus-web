# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  checks: write
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Firebase Hosting
        id: deploy
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OLYMPUS_DFA00 }}
          channelId: live
          projectId: olympus-dfa00
      # The action above occasionally fails with "supplied version is the
      # current active version" after a network-level retry races its own
      # earlier request. The content is already live at that point; retrying
      # with a fresh CLI deploy creates a new version and releases cleanly.
      - name: Set up Firebase CLI for retry
        if: steps.deploy.outcome == 'failure'
        uses: w9jds/setup-firebase@v1.0.0
        with:
          gcp_sa_key: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OLYMPUS_DFA00 }}
      - name: Retry hosting deploy
        if: steps.deploy.outcome == 'failure'
        run: firebase deploy --only hosting --project olympus-dfa00
  deploy_firestore:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: w9jds/setup-firebase@v1.0.0
        with:
          gcp_sa_key: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OLYMPUS_DFA00 }}
      - name: Deploy Firestore rules and indexes
        run: firebase deploy --only firestore:rules,firestore:indexes --project olympus-dfa00
  deploy_functions:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: w9jds/setup-firebase@v1.0.0
        with:
          gcp_sa_key: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OLYMPUS_DFA00 }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OLYMPUS_DFA00 }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: olympus-dfa00
      - name: Enable required GCP APIs
        run: |
          gcloud services enable \
            cloudfunctions.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            --project olympus-dfa00
      - name: Install functions dependencies
        run: npm ci --prefix functions
      - name: Deploy Cloud Functions
        id: deploy_functions
        continue-on-error: true
        run: firebase deploy --only functions --force --project olympus-dfa00
      - name: Grant Cloud Run invoker to allUsers for new callable functions
        run: |
          for svc in listusers; do
            gcloud run services add-iam-policy-binding "$svc" \
              --member="allUsers" \
              --role="roles/run.invoker" \
              --region=us-central1 \
              --project=olympus-dfa00
          done
      - name: Fail if function deploy failed
        if: steps.deploy_functions.outcome == 'failure'
        run: exit 1
