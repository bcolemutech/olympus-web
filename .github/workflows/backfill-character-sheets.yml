name: Backfill Character Sheets

# Gives every save made before character sheets a sheet (L-811 / #638;
# planning/game-systems.md CS9), by running scripts/backfill-character-sheets.js
# against production: its world's system's defaults, its abilities as traits
# and its speed, so it rolls as it already does.
#
# Run it with apply off first: the run's summary lists the saves that would
# get one. Then run it again with apply on and confirm set to "all" (or the
# world id, if you gave one). Saves with a sheet are left alone, so running it
# twice is safe.

on:
  workflow_dispatch:
    inputs:
      world:
        description: 'One world id (its saves only, e.g. nisia-3f9a2c); leave empty for every save'
        required: false
        type: string
        default: ''
      apply:
        description: 'Write the sheets (off: a dry run that only shows the plan)'
        required: true
        type: boolean
        default: false
      confirm:
        description: 'With apply: type "all", or the world id given above'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate the world id
        env:
          WORLD: ${{ inputs.world }}
        run: |
          if [[ -n "$WORLD" && ! "$WORLD" =~ ^[a-z0-9][a-z0-9-]{0,79}$ ]]; then
            echo "::error::Not a world id: $WORLD"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install script dependencies
        run: npm install --prefix scripts

      - name: Backfill character sheets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OLYMPUS_DFA00 }}
          WORLD: ${{ inputs.world }}
          APPLY: ${{ inputs.apply }}
          BACKFILL_CONFIRM: ${{ inputs.confirm }}
        run: |
          args=()
          if [[ -n "$WORLD" ]]; then args+=("$WORLD"); else args+=(--all); fi
          if [[ "$APPLY" == "true" ]]; then args+=(--apply); fi
          set -o pipefail
          node scripts/backfill-character-sheets.js "${args[@]}" 2>&1 | tee backfill.log

      - name: Summary
        if: always()
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          if [[ "$APPLY" == "true" ]]; then
            echo "## Character sheets: applied" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Character sheets: dry run (nothing written)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat backfill.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no output)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
