name: Backfill Art Library

# Moves every world's art from before the image studio into its library
# (L-705 / #541; planning/the-image-studio.md §3 S6), by running
# scripts/backfill-art-library.js against production: each world map, town
# art and battle-map art still held as a Storage path becomes a library
# image, and the world points at it.
#
# Run it with apply off first: the run's summary shows what would move, and
# any file missing from Storage. Then run it again with apply on and confirm
# set to "all" (or the world id, if you gave one). Art already in the
# library is left alone, so running it twice is safe.

on:
  workflow_dispatch:
    inputs:
      world:
        description: 'One world id (e.g. nisia-3f9a2c); leave empty for every world'
        required: false
        type: string
        default: ''
      apply:
        description: 'Move the art (off: a dry run that only shows the plan)'
        required: true
        type: boolean
        default: false
      confirm:
        description: 'With apply: type "all", or the world id given above'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate the world id
        env:
          WORLD: ${{ inputs.world }}
        run: |
          if [[ -n "$WORLD" && ! "$WORLD" =~ ^[a-z0-9][a-z0-9-]{0,79}$ ]]; then
            echo "::error::Not a world id: $WORLD"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install script dependencies
        run: npm install --prefix scripts

      - name: Move the art into the library
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OLYMPUS_DFA00 }}
          WORLD: ${{ inputs.world }}
          APPLY: ${{ inputs.apply }}
          BACKFILL_CONFIRM: ${{ inputs.confirm }}
        run: |
          args=()
          if [[ -n "$WORLD" ]]; then args+=("$WORLD"); else args+=(--all); fi
          if [[ "$APPLY" == "true" ]]; then args+=(--apply); fi
          set -o pipefail
          node scripts/backfill-art-library.js "${args[@]}" 2>&1 | tee backfill.log

      - name: Summary
        if: always()
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          if [[ "$APPLY" == "true" ]]; then
            echo "## Art into the library: applied" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Art into the library: dry run (nothing written)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat backfill.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no output)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
