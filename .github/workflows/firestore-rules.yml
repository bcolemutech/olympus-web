name: Firestore Rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The suite in four shards at once, each with its own emulators, so the
  # suites in a shard still run one at a time (they share emulator data).
  # tests/helpers/sequencer.js splits them by tests/suite-times.json so the
  # shards finish together.
  tests:
    name: tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # match the Functions runtime (firebase.json nodejs22)
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            tests/package-lock.json

      - name: Install Firebase CLI
        id: firebase-cli
        run: |
          npm install -g firebase-tools
          echo "version=$(firebase --version)" >> "$GITHUB_OUTPUT"

      # Keyed on the CLI version, since each CLI release pins its own emulator
      # versions: a new CLI misses the cache, downloads once, and saves it.
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.firebase-cli.outputs.version }}

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Install test dependencies
        run: npm run test:install

      # The map painter's and the art swatches' headless tests (L-924, L-925)
      # run in the Chromium of the Playwright the tests pin.
      - name: Install Chromium for the headless tests
        run: cd tests && npx playwright install --with-deps chromium

      - name: Run the tests (shard ${{ matrix.shard }} of 4)
        run: firebase emulators:exec --only firestore,storage --project demo-olympus-rules-test "cd tests && npm test -- --shard=${{ matrix.shard }}/4"
        env:
          CI: true

  # One check for the whole suite, under the name it has always had
  # (test-rules), for branch protection: it passes only if every shard did.
  test-rules:
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.tests.result }}" = "success"
