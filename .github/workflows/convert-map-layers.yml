name: Convert Map Layers

# Today's battle maps converted (planning/maps-from-data.md §4.7, EX4;
# L-928): every battle map's walls, doors and obstacles stored as its
# geometry, beside its layers, which play goes on reading until the code
# reads only the geometry. The summary has a replay: each map's ways, reach
# and sight asked of it as played now and of its geometry alone.
#
# Run it with apply off first: the summary shows what it would write, the
# replay, and what to look at. Then run it with apply on and confirm set to
# "convert". Running it again is safe: it writes only what differs, so
# nothing.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the changes (off: a dry run that only reports them)'
        required: true
        type: boolean
        default: false
      confirm:
        description: 'With apply: type "convert"'
        required: false
        type: string
        default: ''
      worlds:
        description: 'World ids, space-separated (empty: every world)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check the confirmation
        if: inputs.apply
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$CONFIRM" != "convert" ]]; then
            echo "::error::Not confirmed: type \"convert\" in confirm to apply. Nothing changed."
            exit 1
          fi

      - name: Check the world ids
        env:
          WORLDS: ${{ inputs.worlds }}
        run: |
          for id in $WORLDS; do
            if [[ ! "$id" =~ ^[a-z0-9-]{1,64}$ ]]; then
              echo "::error::Not a world id: $id"
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --prefix scripts
          npm ci --prefix functions

      - name: Convert
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OLYMPUS_DFA00 }}
          APPLY: ${{ inputs.apply }}
          WORLDS: ${{ inputs.worlds }}
        run: node scripts/convert-map-layers.js $WORLDS
