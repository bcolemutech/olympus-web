    enabled: true
    order: 20

  - id: counter
    name: Counter
    description: A click counter demo
    icon: "\U0001F522"
    type: jsx
    file: counter.jsx
    enabled: true
    order: 21

  - id: pool-powerups
    name: Pool Power-Ups
    description: Handicap card system for billiards — deal power-up cards based on skill level
    icon: "\U0001F3B1"
    type: jsx
    file: pool-powerups.jsx
    enabled: true
    order: 22
