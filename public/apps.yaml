apps:
  # ── Embedded apps ───────────────────────────────────────
  - id: symposium
    name: The Symposium
    description: Manage ingredients, equipment, and recipes
    icon: "\U0001F377"
    type: embedded
    path: /apps/symposium/
    enabled: true
    order: 1

  - id: admin
    name: The Pantheon
    description: Administration panel
    icon: "\U0001F3DB"
    type: embedded
    path: /apps/admin/
    enabled: true
    order: 10

  - id: loom
    name: The Loom
    description: A persistent narrative game world
    icon: "\U0001F9F5"
    type: embedded
    path: /apps/loom/
    enabled: true
    order: 11

  # ── MCP connectors (used from Claude; no web UI) ────────
  # `connector` is the URL to add in Claude. The Grand Hall tile copies it.
  - id: scriptorium
    name: Scriptorium
    description: Notes you manage from Claude. Tap to copy the connector URL.
    icon: "\U0001F4DC"
    type: connector
    connector: https://bcoletech.com/mcp/scriptorium
    enabled: true
    order: 30

  # ── JSX applets ─────────────────────────────────────────
  - id: pool-powerups
    name: Pool Power-Ups
    description: Handicap card system for billiards — deal power-up cards based on skill level
    icon: "\U0001F3B1"
    type: jsx
    file: pool-powerups.jsx
    enabled: true
    order: 22

  - id: 14-1-handicap-tracker
    name: 14-1 Handicap Tracker
    description: ELO-based handicap tracker for 14-1 straight pool — manage players, record matches, and auto-adjust target scores
    icon: "\U0001F4CA"
    type: jsx
    file: 14-1-handicap-tracker.jsx
    enabled: true
    order: 23
