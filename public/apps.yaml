apps:
  # ── Embedded apps ───────────────────────────────────────
  - id: symposium
    name: The Symposium
    description: Manage ingredients, equipment, and recipes
    icon: "\U0001F377"
    type: embedded
    path: /apps/symposium/
    enabled: true
    order: 1

  - id: app2
    name: Hermes' Scrolls
    description: Inscribe your thoughts upon the divine parchment.
    icon: "\U0001F4DC"
    type: embedded
    path: /apps/example/
    enabled: true
    order: 0

  - id: admin
    name: The Pantheon
    description: Administration panel
    icon: "\U0001F3DB"
    type: embedded
    path: /apps/admin/
    enabled: true
    order: 10

  # ── JSX applets ─────────────────────────────────────────
  - id: hello-world
    name: Hello World
    description: A simple interactive greeting
    icon: "\U0001F44B"
