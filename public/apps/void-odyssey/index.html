<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Void Odyssey — Olympus</title>

    <!-- Firebase SDK (compat) -->
    <script defer src="/__/firebase/12.9.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-functions-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-analytics-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>

    <!-- Shared Olympus styles -->
    <link rel="stylesheet" href="/styles/app.css" />

    <!-- App-specific styles -->
    <link rel="stylesheet" href="/apps/void-odyssey/styles.css" />
  </head>
  <body>
    <!-- Shared header — rendered by app-header.js -->
    <div id="appHeader"></div>

    <!-- Auth guard — shown while checking auth state -->
    <div class="app-loading" id="app-loading">
      <div class="app-spinner"></div>
      <p class="app-loading-text">Consulting the Oracle&hellip;</p>
    </div>

    <!-- Main content — hidden until authenticated -->
    <main class="app-main hidden" id="app-main">
      <!-- ── Games list view ──────────────────────────────── -->
      <div id="view-games-list" class="hidden">
        <div class="view-header">
          <h1 class="view-title">Your Campaigns</h1>
          <button type="button" class="btn btn-primary" id="btn-new-campaign">
            + New Campaign
          </button>
        </div>
        <div id="games-list-container"></div>
      </div>

      <!-- ── New game wizard view ──────────────────────────── -->
      <div id="view-game-create" class="hidden">
        <div class="wizard-container">
          <div class="wizard-progress">
            <div class="wizard-step-dot" title="Journey"></div>
            <div class="wizard-step-dot" title="Captain"></div>
            <div class="wizard-step-dot" title="Skills"></div>
            <div class="wizard-step-dot" title="Ship"></div>
            <div class="wizard-step-dot" title="Crew"></div>
            <div class="wizard-step-dot" title="Opening Scene"></div>
          </div>
          <div id="wizard-body"></div>
        </div>
      </div>

      <!-- ── Active game view ───────────────────────────────── -->
      <div id="view-game-active" class="hidden">
        <!-- HUD bar (spans full width) -->
        <div class="game-hud" id="game-hud">
          <div class="hud-group">
            <span class="hud-label">Ship</span>
            <span class="hud-value" id="hud-ship-name">—</span>
          </div>
          <div class="hud-group">
            <span class="hud-label">Location</span>
            <span class="hud-value" id="hud-location">—</span>
          </div>
          <div class="hud-group hud-stat">
            <span class="hud-label">Hull</span>
            <div class="hud-progress"><div class="hud-progress-fill" id="hud-hull-bar"></div></div>
            <span class="hud-value-sm" id="hud-hull-pct">—%</span>
          </div>
          <div class="hud-group hud-stat">
            <span class="hud-label">Shields</span>
            <div class="hud-progress">
              <div class="hud-progress-fill" id="hud-shields-bar"></div>
            </div>
            <span class="hud-value-sm" id="hud-shields-pct">—%</span>
          </div>
          <div class="hud-group hud-stat">
            <span class="hud-label">Fuel</span>
            <div class="hud-progress"><div class="hud-progress-fill" id="hud-fuel-bar"></div></div>
            <span class="hud-value-sm" id="hud-fuel-pct">—%</span>
          </div>
          <div class="hud-group">
            <span class="hud-label">Crew</span>
            <span class="hud-value-sm" id="hud-crew-count">—</span>
          </div>
          <div class="hud-group">
            <span class="hud-label">Credits</span>
            <span class="hud-value-sm" id="hud-credits">0</span>
          </div>
          <div class="hud-group">
            <span class="hud-label">Turn</span>
            <span class="hud-value-sm" id="hud-turn-count">0</span>
          </div>
        </div>

        <!-- Two-column layout: narrative + sidebar -->
        <div class="game-active-layout">
          <!-- Left column: narrative + actions -->
          <div class="game-active-main">
            <div class="narrative-panel">
              <div id="narrative-content">
                <p class="narrative-text">Loading narrative&hellip;</p>
              </div>
            </div>

            <div class="action-panel">
              <div class="freeform-input-row" id="freeform-input-row">
                <input
                  type="text"
                  class="form-input freeform-input"
                  placeholder="What will you do?"
                  maxlength="500"
                  aria-label="Type your action"
                />
                <button type="button" class="btn btn-primary btn-sm freeform-submit">Go</button>
              </div>
              <div class="action-suggestions" id="action-buttons"></div>
              <!-- Mobile sidebar toggle — lives inside the sticky action panel so it's always reachable -->
              <button
                type="button"
                class="sidebar-sheet-toggle"
                id="sidebar-sheet-toggle"
                aria-label="Toggle sidebar"
                aria-expanded="false"
              >
                &#9776; Game Info
              </button>
            </div>
          </div>

          <!-- Right column: sidebar -->
          <aside class="sidebar-panel" id="sidebar-panel">
            <button
              type="button"
              class="sidebar-sheet-handle"
              id="sidebar-sheet-handle"
              aria-label="Close sidebar"
            ></button>
            <div class="sidebar-tabs" id="sidebar-tabs"></div>
            <div class="sidebar-content" id="sidebar-content">
              <p class="sidebar-placeholder">Loading&hellip;</p>
            </div>
          </aside>
        </div>

        <!-- Mobile sidebar backdrop -->
        <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

        <!-- Back to campaigns — wired in app.js -->
        <button
          type="button"
          class="btn btn-secondary"
          id="btn-back-to-campaigns"
          style="margin-top: 1rem"
        >
          &larr; All Campaigns
        </button>
      </div>
    </main>

    <!-- Shared header component -->
    <script src="/js/analytics.js"></script>
    <script src="/js/components/app-header.js"></script>

    <!-- App modules (load order per §12) -->
    <script src="/apps/void-odyssey/state.js"></script>
    <script src="/apps/void-odyssey/ships.js"></script>
    <script src="/apps/void-odyssey/journeys.js"></script>
    <script src="/apps/void-odyssey/firestore.js"></script>
    <script src="/apps/void-odyssey/hud.js"></script>
    <script src="/apps/void-odyssey/sidebar.js"></script>
    <script src="/apps/void-odyssey/crew-ui.js"></script>
    <script src="/apps/void-odyssey/codex.js"></script>
    <script src="/apps/void-odyssey/star-map.js"></script>
    <script src="/apps/void-odyssey/quests-ui.js"></script>
    <script src="/apps/void-odyssey/log-ui.js"></script>
    <script src="/apps/void-odyssey/narrative.js"></script>
    <script src="/apps/void-odyssey/engine.js"></script>
    <script src="/apps/void-odyssey/game-create.js"></script>
    <script src="/apps/void-odyssey/app.js"></script>
  </body>
</html>
