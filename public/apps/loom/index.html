<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Loom — Olympus</title>

    <!-- Firebase SDK (compat) -->
    <script defer src="/__/firebase/12.9.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-functions-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>

    <!-- Shared Olympus styles -->
    <link rel="stylesheet" href="/styles/app.css" />

    <!-- App-specific styles -->
    <link rel="stylesheet" href="/apps/loom/loom.css" />
  </head>
  <body>
    <!-- Shared header — rendered by app-header.js -->
    <div id="appHeader"></div>

    <!-- Auth guard — shown while checking auth state -->
    <div class="app-loading" id="app-loading">
      <div class="app-spinner"></div>
      <p class="app-loading-text">Consulting the Oracle&hellip;</p>
    </div>

    <!-- Main content — hidden until authenticated -->
    <main class="app-main hidden" id="app-main">
      <h1 class="app-title">The Loom</h1>
      <p class="app-subtitle">A persistent narrative game world</p>
      <div class="app-divider"></div>

      <div id="loom-root" class="loom-root">
        <!-- World selection -->
        <div id="loom-view-worlds" class="loom-view">
          <div id="loom-world-list" class="loom-world-list"></div>
        </div>

        <!-- Save selection -->
        <div id="loom-view-saves" class="loom-view hidden">
          <button class="loom-back-link" id="loom-back-to-worlds" type="button">
            &larr; Choose a different world
          </button>
          <h2 class="loom-view-title" id="loom-save-select-title"></h2>

          <div class="app-loading hidden" id="loom-saves-loading">
            <div class="app-spinner"></div>
          </div>
          <p class="loom-error hidden" id="loom-saves-error"></p>
          <p class="loom-empty-state hidden" id="loom-save-empty">
            No saved adventures yet in this world.
          </p>

          <div id="loom-save-list" class="loom-save-list"></div>

          <button class="app-btn" id="loom-new-save-btn" type="button">+ New Save</button>

          <form id="loom-new-save-form" class="loom-new-save-form hidden">
            <div class="loom-form-group">
              <label class="loom-form-label" for="loom-new-save-name">Save name</label>
              <input
                class="loom-form-input"
                id="loom-new-save-name"
                type="text"
                maxlength="200"
                placeholder="e.g. First Voyage"
                required
              />
            </div>
            <div class="loom-form-group">
              <label class="loom-form-label" for="loom-new-character-name">Character name</label>
              <input
                class="loom-form-input"
                id="loom-new-character-name"
                type="text"
                maxlength="200"
                placeholder="e.g. Ishmael"
                required
              />
            </div>
            <p class="loom-error hidden" id="loom-new-save-error"></p>
            <div class="loom-form-actions">
              <button class="app-btn" id="loom-new-save-submit" type="submit">Create</button>
              <button class="loom-back-link" id="loom-new-save-cancel" type="button">Cancel</button>
            </div>
          </form>
        </div>

        <!-- Play view -->
        <div id="loom-view-play" class="loom-view hidden">
          <button class="loom-back-link" id="loom-back-to-saves" type="button">&larr; Saves</button>

          <div class="loom-summary hidden" id="loom-summary"></div>

          <div class="loom-narration-log" id="loom-narration-log"></div>

          <div class="loom-suggested-actions" id="loom-suggested-actions"></div>

          <form id="loom-turn-form" class="loom-turn-form">
            <textarea
              class="loom-turn-input"
              id="loom-turn-input"
              placeholder="What do you do?"
              rows="2"
              maxlength="2000"
            ></textarea>
            <button class="app-btn" id="loom-turn-submit" type="submit">Act</button>
          </form>

          <div class="app-loading hidden" id="loom-turn-loading">
            <div class="app-spinner"></div>
            <p class="app-loading-text">The Loom weaves&hellip;</p>
          </div>
          <p class="loom-error hidden" id="loom-turn-error"></p>
        </div>
      </div>
    </main>

    <!-- Shared header component -->
    <script src="/js/components/app-header.js"></script>

    <!-- Loom modules (load order matters) -->
    <script src="/apps/loom/js/state.js"></script>
    <script src="/apps/loom/js/worlds.js"></script>
    <script src="/apps/loom/js/saves.js"></script>
    <script src="/apps/loom/js/play.js"></script>
    <script src="/apps/loom/js/app.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        firebase.auth().onAuthStateChanged(function (user) {
          if (!user) {
            window.location.href = '/';
            return;
          }

          // Render the shared header
          window.OlympusHeader.render('The Loom');

          // Hide loading, show main content
          document.getElementById('app-loading').classList.add('hidden');
          document.getElementById('app-main').classList.remove('hidden');

          // Initialize the app
          window.Loom.app.init(user);
        });
      });
    </script>
  </body>
</html>
