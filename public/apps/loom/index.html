<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Loom — Olympus</title>

    <!-- Firebase SDK (compat) -->
    <script defer src="/__/firebase/12.9.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-functions-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-storage-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>

    <!-- Shared Olympus styles -->
    <link rel="stylesheet" href="/styles/app.css" />

    <!-- App-specific styles -->
    <link rel="stylesheet" href="/apps/loom/loom.css" />
  </head>
  <body>
    <!-- Shared header — rendered by app-header.js -->
    <div id="appHeader"></div>

    <!-- Auth guard — shown while checking auth state -->
    <div class="app-loading" id="app-loading">
      <div class="app-spinner"></div>
      <p class="app-loading-text">Consulting the Oracle&hellip;</p>
    </div>

    <!-- Main content — hidden until authenticated -->
    <main class="app-main hidden" id="app-main">
      <h1 class="app-title">The Loom</h1>
      <p class="app-subtitle">A persistent narrative game world</p>
      <div class="app-divider"></div>

      <div id="loom-root" class="loom-root">
        <!-- World selection -->
        <div id="loom-view-worlds" class="loom-view">
          <div id="loom-world-list" class="loom-world-list"></div>
        </div>

        <!-- Save selection -->
        <div id="loom-view-saves" class="loom-view hidden">
          <button class="loom-back-link" id="loom-back-to-worlds" type="button">
            &larr; Choose a different world
          </button>
          <!-- The world's cover, its name over it (L-729) -->
          <div class="loom-hero" id="loom-saves-hero">
            <h2 class="loom-view-title" id="loom-save-select-title"></h2>
          </div>

          <div class="app-loading hidden" id="loom-saves-loading">
            <div class="app-spinner"></div>
          </div>
          <p class="loom-error hidden" id="loom-saves-error"></p>
          <p class="loom-empty-state hidden" id="loom-save-empty">
            No saved adventures yet in this world.
          </p>

          <div id="loom-save-list" class="loom-save-list"></div>

          <button class="app-btn" id="loom-new-save-btn" type="button">+ New Save</button>

          <form id="loom-new-save-form" class="loom-new-save-form hidden">
            <div class="loom-form-group">
              <label class="loom-form-label" for="loom-new-save-name">Save name</label>
              <input
                class="loom-form-input"
                id="loom-new-save-name"
                type="text"
                maxlength="200"
                placeholder="e.g. First Voyage"
                required
              />
            </div>
            <div class="loom-form-group">
              <label class="loom-form-label" for="loom-new-character-name">Character name</label>
              <input
                class="loom-form-input"
                id="loom-new-character-name"
                type="text"
                maxlength="200"
                placeholder="e.g. Ishmael"
                required
              />
            </div>
            <p class="loom-error hidden" id="loom-new-save-error"></p>
            <div class="loom-form-actions">
              <button class="app-btn" id="loom-new-save-submit" type="submit">Create</button>
              <button class="loom-back-link" id="loom-new-save-cancel" type="button">Cancel</button>
            </div>
          </form>
          <!-- Making the character (L-812): creation.js draws the flow here -->
          <div id="loom-create-host" class="hidden"></div>
        </div>

        <!-- While a game loads: its world's cover (L-729) -->
        <div class="loom-play-cover hidden" id="loom-play-cover" role="status">
          <div class="loom-play-cover-text">
            <p class="loom-play-cover-name" id="loom-play-cover-name"></p>
            <p class="loom-play-cover-note">The Loom weaves&hellip;</p>
          </div>
        </div>

        <!-- Play view -->
        <!-- Play view: shell.js builds its frame (menu bar, map, side panel or,
             on a phone, bottom sheet) in #loom-play-shell and hosts the panes
             below in it -->
        <div id="loom-view-play" class="loom-view hidden">
          <div id="loom-play-shell"></div>

          <!-- The map (map.js): the world map (discovered places, routes, travel),
                 or, in a town, the town view (town.js) -->
          <section class="loom-map-pane hidden" id="loom-map-pane" aria-label="Map">
            <div class="loom-map-panel" id="loom-map-panel">
              <div class="loom-map-layers hidden" id="loom-map-layers" role="group">
                <button
                  class="loom-map-layer hidden"
                  id="loom-layer-battle"
                  type="button"
                  aria-pressed="false"
                >
                  Here
                </button>
                <button
                  class="loom-map-layer is-active"
                  id="loom-layer-town"
                  type="button"
                  aria-pressed="true"
                >
                  Town
                </button>
                <button
                  class="loom-map-layer"
                  id="loom-layer-world"
                  type="button"
                  aria-pressed="false"
                >
                  World
                </button>
              </div>
              <div class="loom-map-controls">
                <button
                  class="loom-map-btn"
                  id="loom-map-zoom-in"
                  type="button"
                  aria-label="Zoom in"
                >
                  +
                </button>
                <button
                  class="loom-map-btn"
                  id="loom-map-zoom-out"
                  type="button"
                  aria-label="Zoom out"
                >
                  &minus;
                </button>
                <button
                  class="loom-map-btn"
                  id="loom-map-home"
                  type="button"
                  aria-label="Show where I am"
                >
                  &#9678;
                </button>
              </div>
            </div>
            <div class="loom-map-info" id="loom-map-info" aria-live="polite"></div>
          </section>

          <!-- The panel's content, drawn by js/journal.js (L-726) -->
          <section class="loom-story-pane" id="loom-story-pane" aria-label="Story"></section>
        </div>
      </div>
    </main>

    <!-- Shared header component -->
    <script src="/js/components/app-header.js"></script>

    <!-- Preact and htm for the play view's components (L-721) -->
    <script
      crossorigin="anonymous"
      src="https://unpkg.com/preact@10.29.8/dist/preact.umd.js"
      integrity="sha384-sv9MUf3DTScOmi2+NOnSmwR2JpUeADK0KYAP8ohhmg99VOdSccabVgt/PnPDXK0N"
    ></script>
    <script
      crossorigin="anonymous"
      src="https://unpkg.com/preact@10.29.8/hooks/dist/hooks.umd.js"
      integrity="sha384-5BuvBL8F0gboRla2VFizWuUXbA44J2dFYJZZGhPD7/8zlTbKMJAPtgIerv7vIpPw"
    ></script>
    <script
      crossorigin="anonymous"
      src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"
      integrity="sha384-toVdrLSMaw7Y55MowcKqkmFL/Ek6Sky62NOk0b5sDDZBu2wcoPyyQUt9unDVjXhL"
    ></script>

    <!-- PixiJS for the map engine (L-722): WebGL, or canvas without it -->
    <script
      crossorigin="anonymous"
      src="https://unpkg.com/pixi.js@8.21.0/dist/pixi.min.js"
      integrity="sha384-M63Y6T7xfuqwc9J8+LKmpo0Eib/j8rOHiD7C1Nt1HwdznFV+5RVUZUHquFP/4ciG"
    ></script>

    <!-- Loom modules (load order matters) -->
    <script src="/apps/loom/js/state.js"></script>
    <script src="/apps/loom/js/theme.js"></script>
    <script src="/apps/loom/js/ui.js"></script>
    <script src="/apps/loom/js/map-math.js"></script>
    <script src="/apps/loom/js/town-layout.js"></script>
    <script src="/apps/loom/js/grid-paths.js"></script>
    <script src="/apps/loom/js/town-paths.js"></script>
    <script src="/apps/loom/js/layers.js"></script>
    <script src="/apps/loom/js/worlds.js"></script>
    <script src="/apps/loom/js/saves.js"></script>
    <script src="/apps/loom/js/creation.js"></script>
    <script src="/apps/loom/js/engine.js"></script>
    <script src="/apps/loom/js/draw.js"></script>
    <script src="/apps/loom/js/world.js"></script>
    <script src="/apps/loom/js/town.js"></script>
    <script src="/apps/loom/js/battle.js"></script>
    <script src="/apps/loom/js/map.js"></script>
    <script src="/apps/loom/js/overlay.js"></script>
    <script src="/apps/loom/js/journal.js"></script>
    <script src="/apps/loom/js/play.js"></script>
    <script src="/apps/loom/js/shell.js"></script>
    <script src="/apps/loom/js/rules.js"></script>
    <script src="/apps/loom/js/character.js"></script>
    <script src="/apps/loom/js/app.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        firebase.auth().onAuthStateChanged(function (user) {
          if (!user) {
            window.location.href = '/';
            return;
          }

          // Render the shared header
          window.OlympusHeader.render('The Loom');

          // Hide loading, show main content
          document.getElementById('app-loading').classList.add('hidden');
          document.getElementById('app-main').classList.remove('hidden');

          // Initialize the app
          window.Loom.app.init(user);
        });
      });
    </script>
  </body>
</html>
