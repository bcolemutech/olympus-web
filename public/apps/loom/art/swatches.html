<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>The Loom's art swatches</title>
    <!--
      Every material and catalog object, drawn from the art in this folder
      (planning/maps-from-data.md; L-925 / #729), and the box with a question
      mark an object with no art gets. It holds no data and needs no sign-in.
      Headless Chrome loads it in tests/loom-art-swatches.test.js, which reads
      window.__swatches once <html data-ready="true">.
    -->
    <style>
      :root {
        --bg: #14161b;
        --panel: #1c1f26;
        --ink: #e6e8ec;
        --muted: #9aa1ad;
        --line: #343944;
        --bad: #ff6b6b;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme='dark']) {
          --bg: #f4f5f7;
          --panel: #ffffff;
          --ink: #1c1f26;
          --muted: #586070;
          --line: #cfd3da;
          --bad: #c0262d;
          color-scheme: light;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px 16px 48px;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 16px;
        margin: 28px 0 10px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }
      p.note {
        margin: 0;
        color: var(--muted);
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      figure {
        margin: 0;
        padding: 8px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      figure[data-state='missing'] {
        border-color: var(--bad);
      }
      figcaption {
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
        max-width: 160px;
      }
      figcaption b {
        color: var(--ink);
        font-weight: 600;
      }
      .tile {
        width: 128px;
        height: 96px;
        background-size: 64px 64px;
        background-repeat: repeat;
        border-radius: 4px;
      }
      .strip {
        width: 160px;
        height: 32px;
        background-size: 128px 32px;
        background-repeat: repeat-x;
        background-color: #4a5160;
        border-radius: 4px;
      }
      .floor {
        padding: 12px;
        background: #4a5160;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 80px;
      }
      .floor img {
        display: block;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>The Loom's art swatches</h1>
      <p class="note" id="summary">Loading…</p>
      <div id="sections"></div>
    </main>
    <script src="/apps/loom/js/materials.js"></script>
    <script>
      (function () {
        'use strict';
        var catalog = window.Loom.materials;
        var sections = document.getElementById('sections');
        var checks = [];
        var failed = [];

        function section(title, note) {
          var h = document.createElement('h2');
          h.textContent = title;
          var grid = document.createElement('div');
          grid.className = 'grid';
          sections.appendChild(h);
          if (note) {
            var p = document.createElement('p');
            p.className = 'note';
            p.textContent = note;
            sections.appendChild(p);
          }
          sections.appendChild(grid);
          return grid;
        }

        function figure(grid, id, label, detail, art, face) {
          var fig = document.createElement('figure');
          fig.dataset.id = id;
          fig.dataset.state = 'loading';
          fig.appendChild(face);
          var cap = document.createElement('figcaption');
          var b = document.createElement('b');
          b.textContent = label;
          cap.appendChild(b);
          cap.appendChild(document.createTextNode(' ' + detail));
          fig.appendChild(cap);
          grid.appendChild(fig);
          // Whether the art loads, as the engine will draw it.
          checks.push(
            new Promise(function (resolve) {
              var probe = new Image();
              probe.onload = function () {
                fig.dataset.state = 'ready';
                fig.dataset.width = probe.naturalWidth;
                fig.dataset.height = probe.naturalHeight;
                resolve();
              };
              probe.onerror = function () {
                fig.dataset.state = 'missing';
                failed.push(id);
                resolve();
              };
              probe.src = art;
            })
          );
        }

        var FACES = {
          ground: function (url) {
            var d = document.createElement('div');
            d.className = 'tile';
            d.style.backgroundImage = 'url(' + url + ')';
            return d;
          },
          strip: function (url) {
            var d = document.createElement('div');
            d.className = 'strip';
            d.style.backgroundImage = 'url(' + url + ')';
            return d;
          },
        };
        var TITLES = {
          ground: ['Floors and terrain', 'Tiles of 64 × 64 that repeat, shown 2 × 1.5.'],
          line: ['Rivers and roads', 'Drawn along their length.'],
          wall: ['Walls', 'Drawn along their length; glass, bars and fence are see-through.'],
          door: ['Doors', 'In a wall, in its place; glass, bars and gates are see-through.'],
          window: ['Windows', 'In a wall; never walked through.'],
        };

        catalog.KINDS.forEach(function (kind) {
          var grid = section(TITLES[kind][0], TITLES[kind][1]);
          catalog.materialsOf(kind).forEach(function (item) {
            var url = catalog.artUrl(item.art);
            var flags = [];
            if (item.water) flags.push('water');
            if (item.seeThrough) flags.push('see-through');
            figure(
              grid,
              kind + ':' + item.id,
              item.name,
              flags.length ? '(' + flags.join(', ') + ')' : '',
              url,
              FACES[kind === 'ground' ? 'ground' : 'strip'](url)
            );
          });
        });

        var groups = [];
        catalog.OBJECT_KINDS.forEach(function (item) {
          if (groups.indexOf(item.group) === -1) groups.push(item.group);
        });
        var objects = section(
          'Objects',
          'Seen from above, at 16 units to the foot; each shows its default size.'
        );
        groups.forEach(function (group) {
          catalog.OBJECT_KINDS.filter(function (item) {
            return item.group === group;
          }).forEach(function (item) {
            var url = catalog.artUrl(item.art);
            var floor = document.createElement('div');
            floor.className = 'floor';
            var img = document.createElement('img');
            img.alt = item.name;
            img.src = url;
            floor.appendChild(img);
            figure(
              objects,
              'object:' + item.id,
              item.name,
              item.size[0] + ' × ' + item.size[1] + ' ft',
              url,
              floor
            );
          });
        });

        var none = section(
          'An object with no art',
          'No art of its own, none for its kind in its world, none in the catalog: a box with a question mark.'
        );
        var unknown = catalog.artFor({ kind: 'no-such-kind' }, {});
        var floor = document.createElement('div');
        floor.className = 'floor';
        var box = document.createElement('img');
        box.alt = 'A box with a question mark';
        box.src = unknown.url;
        floor.appendChild(box);
        figure(none, 'object:unknown', 'Unknown', '(' + unknown.from + ')', unknown.url, floor);

        Promise.all(checks).then(function () {
          var total = checks.length;
          window.__swatches = {
            total: total,
            loaded: total - failed.length,
            failed: failed,
            unknownFrom: unknown.from,
          };
          document.getElementById('summary').textContent =
            total -
            failed.length +
            ' of ' +
            total +
            ' swatches loaded' +
            (failed.length ? '; missing: ' + failed.join(', ') : '.');
          document.documentElement.dataset.ready = 'true';
        });
      })();
    </script>
  </body>
</html>
