<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tortuga — Olympus</title>

    <!-- Firebase SDK (compat) -->
    <script defer src="/__/firebase/12.9.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />

    <!-- Shared Olympus styles -->
    <link rel="stylesheet" href="/styles/app.css" />
    <link rel="stylesheet" href="/apps/tortuga/tortuga.css" />
  </head>
  <body>
    <!-- Shared header — rendered by app-header.js -->
    <div id="appHeader"></div>

    <!-- Auth guard — shown while checking auth state -->
    <div class="app-loading" id="app-loading">
      <div class="app-spinner"></div>
      <p class="app-loading-text">Consulting the Oracle&hellip;</p>
    </div>

    <!-- Main content — hidden until authenticated -->
    <main class="app-main hidden" id="app-main">
      <!-- Cartographer (world builder) mode shell -->
      <section id="shell-world" class="hidden">
        <h1 class="app-title">Cartographer</h1>
        <p class="app-subtitle">Build and explore worlds.</p>
        <div class="app-divider"></div>
        <div id="cartographer-import"></div>
        <div id="land-heavy-warning" class="land-heavy-warning hidden">
          <span class="land-heavy-warning-icon" aria-hidden="true">&#9888;</span>
          <span class="land-heavy-warning-text"
            >This map is land-heavy. Tortuga plays best on oceanic maps.</span
          >
          <div class="land-heavy-warning-actions">
            <button class="btn-cancel" id="land-heavy-cancel" type="button">
              Choose Another Map
            </button>
            <button class="app-btn app-btn--sm" id="land-heavy-continue" type="button">
              Continue Anyway
            </button>
          </div>
        </div>
        <div id="cartographer-knobs" class="hidden"></div>
        <div id="cartographer-editor" class="hidden"></div>
        <div class="world-list-section">
          <div class="world-list-panel">
            <div id="world-list-toolbar-world"></div>
            <div id="world-list-world" class="world-list"></div>
          </div>
          <div id="world-preview-world" class="world-preview">
            <p class="world-preview-placeholder">Select a world to preview</p>
          </div>
        </div>
        <div id="map-world" class="tortuga-map hidden"></div>
      </section>

      <!-- The Account (campaign play) mode shell -->
      <section id="shell-play" class="hidden">
        <h1 class="app-title">The Account</h1>
        <p class="app-subtitle">On the account, Captain.</p>
        <div class="app-divider"></div>
        <div class="world-list-section">
          <div class="world-list-panel">
            <div id="world-list-toolbar-play"></div>
            <div id="world-list-play" class="world-list"></div>
          </div>
          <div id="world-preview-play" class="world-preview">
            <p class="world-preview-placeholder">Select a world to preview</p>
          </div>
        </div>
        <div id="new-game-panel" class="hidden"></div>
      </section>
    </main>

    <!-- Shared header component -->
    <script src="/js/components/app-header.js"></script>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- App modules: state first, then helpers, app last -->
    <script src="/apps/tortuga/state.js"></script>
    <script src="/apps/tortuga/play/ship-types.js"></script>
    <script src="/apps/tortuga/map-renderer.js"></script>
    <script src="/apps/tortuga/firestore.js"></script>
    <script src="/apps/tortuga/world-list.js"></script>
    <script src="/apps/tortuga/cartographer/pathfinder.js"></script>
    <script src="/apps/tortuga/cartographer/overlay.js"></script>
    <script src="/apps/tortuga/cartographer/importer.js"></script>
    <script src="/apps/tortuga/cartographer/editor.js"></script>
    <script src="/apps/tortuga/new-game.js"></script>
    <script src="/apps/tortuga/app.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        firebase.auth().onAuthStateChanged(function (user) {
          if (!user) {
            window.location.href = '/';
            return;
          }

          window.OlympusHeader.render('Tortuga');

          document.getElementById('app-loading').classList.add('hidden');
          document.getElementById('app-main').classList.remove('hidden');

          window.Tortuga.init(user);
        });
      });
    </script>
  </body>
</html>
